<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>フォーム一覧 | 株式会社TeeenS</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans JP',sans-serif;color:#09090b;background:#fff;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.hd{border-bottom:1px solid rgba(9,9,11,.1)}
.hd-in{max-width:680px;margin:0 auto;padding:16px 24px}
.hd-in img{height:28px}
main{max-width:680px;margin:0 auto;padding:56px 24px 80px}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(9,9,11,.32);font-weight:600}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:14px 0 16px}
.lead{color:rgba(9,9,11,.55);font-size:14.5px;margin-bottom:36px}
.card{display:block;border:1px solid rgba(9,9,11,.1);background:#fafafa;padding:24px;margin-bottom:12px;transition:.15s}
.card:hover{border-color:rgba(9,9,11,.3)}
.card h2{font-size:16px;font-weight:700;margin-bottom:6px}
.card p{font-size:13px;color:rgba(9,9,11,.55)}
.card .go{font-size:12.5px;margin-top:12px;font-weight:600}
footer{border-top:1px solid rgba(9,9,11,.1);font-size:11.5px;color:rgba(9,9,11,.32)}
footer div{max-width:680px;margin:0 auto;padding:28px 24px}
</style>
</head>
<body>
<header class="hd"><div class="hd-in"><a href="https://teeen-s.com"><img src="logo-side-trans.png" alt="株式会社TeeenS"/></a></div></header>
<main>
  <div class="eyebrow">Forms</div>
  <h1>フォーム一覧</h1>
  <p class="lead">制作を進めるうえでご記入・ご確認をお願いしているページです。</p>
  <a class="card" href="hearing/">
    <h2>LP制作 ヒアリングシート</h2>
    <p>ランディングページを制作するために必要な内容をお聞かせください。所要5〜10分、全17問。</p>
    <div class="go">記入する →</div>
  </a>
  <a class="card" href="notice/">
    <h2>公開前のご確認事項</h2>
    <p>公開までにご確認とご対応をお願いしたい内容です。費用が発生するものを含みます。</p>
    <div class="go">確認する →</div>
  </a>
</main>
<footer><div>© 2026 株式会社TeeenS</div></footer>
</body>
</html>
